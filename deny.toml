# cargo-deny policy. CI runs `bans licenses sources` on every PR and push to main,
# and `advisories` daily (a new advisory must not turn unrelated PRs red).

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only. Checked against the real tree (rmcp, ureq, oauth2, lettre,
# html2text, security-framework) in the Phase 0 dependency measurement.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Keep the tree small and the TLS/network stack singular. ureq + rustls is the only
# HTTP client; adding any of these needs a deliberate, reviewed change to this file.
deny = [
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "hyper-util" },
    { crate = "h2" },
    { crate = "tower" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "curl" },
    { crate = "curl-sys" },
    # Not a ban: only one version of ureq may be in the tree. A second major (for example
    # through oauth2's own `ureq` feature, which pulls ureq 2) would be a second HTTP client
    # outside the egress guard. `multiple-versions` above only warns, so this entry is what
    # fails the check. docs/decisions/0004-dependency-policy-and-libraries.md
    { crate = "ureq", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
