name: CI

# Runs on every commit pushed to a pull request and on every merge to main.
# Feature branches deliberately have no `push` trigger: the pull_request event already
# covers every commit and a branch push would only duplicate the run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default. Each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs only; never cancel a run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # Only main writes the cache, so a pull request cannot poison it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test
    # The whole suite runs on Linux. Code that only compiles on one platform (the macOS
    # credential store, phase 2) gets its own narrow job on that platform when it lands (ADR 0012).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check with the declared minimum Rust version
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "Checking with Rust $msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --locked --all-targets

  doc:
    name: doc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny (bans, licenses, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Advisories run on a daily schedule in security.yml, so a newly published
      # advisory cannot turn unrelated pull requests red.
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          command-arguments: bans licenses sources

  zizmor:
    name: zizmor (workflow security lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Annotation mode needs no security-events permission, so it also works on fork PRs.
      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          advanced-security: false
          annotations: true
          persona: regular

  dependency-review:
    name: dependency-review
    # Needs a pull request diff, so it is skipped on pushes to main. On a private repository it
    # also needs GitHub Code Security, so it runs only while the repository is public (ADR 0011).
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
          # Licenses are enforced by cargo-deny.
          license-check: false

  # The single status check that rulesets require. `skipped` is fine (dependency-review
  # on pushes); anything else from any job fails it.
  ci-success:
    name: ci-success
    if: ${{ always() }}
    needs: [fmt, clippy, test, msrv, doc, deny, zizmor, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required job finished with: $result"; exit 1 ;;
            esac
          done
