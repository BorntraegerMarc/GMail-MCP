name: Release

# Pushing a tag vX.Y.Z builds a universal macOS binary, attests its provenance, and
# publishes a GitHub release. A manual run (workflow_dispatch) is a dry run: it builds
# and uploads the artifacts but never attests or publishes.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to prove the tag commit is on main
          persist-credentials: false
      - name: Verify tag, Cargo.toml version, branch and changelog
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$EVENT_NAME" = "push" ]; then
            [ "$REF_NAME" = "v$version" ] || { echo "Tag $REF_NAME does not match Cargo.toml version $version"; exit 1; }
            git merge-base --is-ancestor "$SHA" origin/main || { echo "Tagged commit is not on main"; exit 1; }
            scripts/release-notes.sh "$version" CHANGELOG.md > /dev/null
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (universal macOS binary)
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache here on purpose: release artifacts must not depend on cached state.
      - name: Install pinned toolchain and both macOS targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both architectures
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target"
          done
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist stage
          lipo -create -output stage/gmail-mcp \
            target/aarch64-apple-darwin/release/gmail-mcp \
            target/x86_64-apple-darwin/release/gmail-mcp
          lipo -info stage/gmail-mcp
          cp LICENSE README.md stage/
          archive="gmail-mcp-${VERSION}-macos-universal.tar.gz"
          tar -czf "dist/$archive" -C stage .
          (cd dist && shasum -a 256 "$archive" > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attest and publish
    needs: [verify, build]
    # Tag pushes only; a manual run stops after `build`.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # keyless Sigstore signing for the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/gmail-mcp-*.tar.gz
      # Draft first, attach every asset, then publish: the order GitHub recommends so
      # that immutable releases are complete the moment they become immutable.
      - name: Create draft release, upload assets, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          scripts/release-notes.sh "$VERSION" CHANGELOG.md > notes.md
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md dist/*
          gh release edit "$TAG" --draft=false
