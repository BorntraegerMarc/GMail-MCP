version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait before adopting a brand-new release, so a compromised publish has time to
    # surface. Cooldown applies to version updates only, never to security updates.
    cooldown:
      default-days: 5
      semver-major-days: 30
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # Keeps the exact toolchain pin in rust-toolchain.toml current (version updates only,
  # never security updates). Each bump is a PR that CI builds and a human merges. The
  # cooldown is configured for when it takes effect: Dependabot currently ignores it for
  # this ecosystem (dependabot/dependabot-core#16940).
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
