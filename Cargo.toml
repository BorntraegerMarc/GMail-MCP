[package]
name = "gmail-mcp"
version = "0.0.0"
edition = "2024"
# 1.89 is the highest `rust-version` in the planned dependency tree (measured 2026-11-23:
# uuid, via rmcp). CI builds with exactly this toolchain in the `msrv` job.
rust-version = "1.89"
description = "Secure, minimal, unofficial Gmail MCP server: reads your mail and nothing else; credentials in the OS credential store (macOS Keychain first)"
license = "MIT"
repository = "https://github.com/BorntraegerMarc/GMail-MCP"
readme = "README.md"
keywords = ["mcp", "gmail", "oauth2", "security", "claude"]
categories = ["command-line-utilities"]
# Never published to crates.io: distribution is source + attested GitHub releases.
publish = false

# Dependencies arrive in the PRs that use them. Policy (see CONTRIBUTING.md and
# docs/decisions/0004-dependency-policy-and-libraries.md): official or very widely used crates
# only, exact `=` pins, Cargo.lock committed. tests/deps_policy.rs fails when this list, a
# version requirement or a feature set changes without its allowlist changing too.

[dependencies]
# PKCE, the consent URL and the code exchange (src/auth.rs), and the random token type behind
# the delimiter nonce in src/text.rs. No HTTP-client feature: all traffic goes through the
# egress guard in src/http.rs, which implements the library's `SyncHttpClient` trait.
oauth2 = { version = "=5.0.0", default-features = false }
# Reads Google's client secret file and encodes the credential-store record. Already in the
# tree through `oauth2`, so it adds no crate. Used on `serde_json::Value` only: no derive macros.
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
# Blocking HTTPS client behind the egress guard (src/http.rs); TLS through rustls.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }

# The macOS Keychain store (src/store/keychain.rs), used directly instead of `keyring`
# (docs/decisions/0006-credentials-in-os-credential-store.md). Other platforms compile a
# fail-closed stub, so this crate is not built there.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }

[dev-dependencies]
# Property tests on untrusted-input handling.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[lints.rust]
# This crate needs no unsafe code; platform FFI (such as the macOS Keychain) lives in a dependency.
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# stdout belongs to the MCP protocol; stderr goes through one audited logging module.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# No panics on untrusted input.
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# A panic or an arithmetic overflow on hostile input must stop the process, not let it
# continue with corrupted state.
panic = "abort"
strip = "symbols"
overflow-checks = true
